<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6FB2BF">
<title>The Journey — a wedding on the Adriatic</title>
<meta name="description" content="Wedding details, travel, places to stay and RSVP — walk the path and choose a doorway.">
<!-- Keeps the site out of Google. Delete this line if you want it findable. -->
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   The Journey — a walk through the Bay of Kotor
   1. Tokens   2. Base   3. Loader   4. Hub   5. Entrances   6. Rooms
   7. Panel & content   8. RSVP form   9. Persistent UI   10. Ambient motion
   11. Mobile   12. Reduced motion / print
   ========================================================================== */

/* --- 1 · tokens ---------------------------------------------------------- */
:root {
  --cream:      #F4E7D3;
  --cream-2:    #FBF4E8;
  --cream-3:    #E8D9BE;
  --terracotta: #C4643C;
  --terra-deep: #9B4A2A;
  --terra-soft: #D98A5E;
  --espresso:   #3B2A22;
  --esp-soft:   #6A5245;
  --olive:      #7C8B5E;
  --olive-deep: #5B6A44;
  --dusty:      #7A97A8;
  --dusty-deep: #4E6E80;
  --bay:        #2E5A63;
  --gold:       #E4A853;
  --gold-light: #F5D08A;
  --night:      #1E2A3A;
  --sea-pale:   #EAF6F5;
  --sea-light:  #B6DEE2;
  --sea-mid:    #6FB2BF;
  --sea-deep:   #2F7186;
  --sea-ink:    #14434F;

  --panel-bg:   rgba(251, 244, 232, 0.94);
  --panel-line: rgba(59, 42, 34, 0.14);
  --shadow-lg:  0 30px 80px -30px rgba(59, 42, 34, .55);
  --shadow-md:  0 14px 34px -14px rgba(59, 42, 34, .45);

  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body: "Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  --ease: cubic-bezier(.65, .05, .36, 1);
  --panel-w: min(46vw, 620px);
}

/* --- 2 · base ------------------------------------------------------------ */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  overflow: hidden;
  background: var(--espresso);
  color: var(--espresso);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
/* stop double-taps selecting the chrome; panel copy stays selectable */
body { user-select: none; -webkit-user-select: none; }
.panel-scroll, .panel-scroll * { user-select: text; -webkit-user-select: text; }
a { color: var(--terra-deep); }
svg { display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

#stage { position: fixed; inset: 0; overflow: hidden; }

/* --- 3 · loader ---------------------------------------------------------- */
#loader {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.1rem; text-align: center; padding: 2rem;
  background:
    radial-gradient(120% 80% at 50% 8%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
    linear-gradient(168deg, var(--sea-pale) 0%, var(--sea-light) 34%, var(--sea-mid) 70%, var(--sea-deep) 100%);
  transition: opacity .9s var(--ease), visibility .9s;
}
#loader.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-names {
  font-family: var(--display); font-weight: 300; letter-spacing: .06em;
  font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 1; color: #17323A; margin: 0;
  text-shadow: 0 2px 30px rgba(255,255,255,.55);
}
.loader-sub {
  font-size: clamp(.78rem, 2.2vw, .95rem); letter-spacing: .34em; text-transform: uppercase;
  color: var(--sea-ink); margin: 0;
}
.loader-note {
  max-width: 34ch; font-size: .96rem; line-height: 1.65; color: #2B5A66;
  font-family: var(--display); font-size: 1.22rem; font-style: italic;
}
.loader-bar { width: min(240px, 60vw); height: 2px; background: rgba(20,67,79,.20); overflow: hidden; border-radius: 2px; }
.loader-bar i { display: block; height: 100%; width: 0; background: var(--sea-ink); transition: width .4s var(--ease); }
.enter-btn {
  margin-top: .6rem; padding: .95rem 2.4rem; min-height: 48px;
  border: 1px solid rgba(255,255,255,.9); border-radius: 999px;
  font-size: .78rem; letter-spacing: .26em; text-transform: uppercase; color: var(--sea-ink);
  background: rgba(255,255,255,.46);
  transition: background .4s var(--ease), color .4s var(--ease), transform .4s var(--ease);
  opacity: 0; transform: translateY(10px); pointer-events: none;
}
.enter-btn.is-ready { opacity: 1; transform: none; pointer-events: auto; }
.enter-btn:hover { background: var(--sea-ink); color: var(--sea-pale); border-color: var(--sea-ink); transform: translateY(-2px); }

/* --- 4 · the hub --------------------------------------------------------- */
#hub {
  position: absolute; inset: 0; overflow: hidden;
  background: #8FB0C4;
  cursor: grab;
}
#hub.is-dragging { cursor: grabbing; }
#hub.is-hidden { visibility: hidden; }
.camera {
  position: absolute; top: 50%; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.world { position: relative; }
.layer {
  position: absolute; top: 0; left: 0; height: 100%;
  will-change: transform;
  pointer-events: none;
}
.layer > svg { width: 100%; height: 100%; }

/* --- 5 · entrances ------------------------------------------------------- */
.entrance-plane { position: absolute; inset: 0; }
/* .layer turns pointer events off; the doorways need them back on */
.entrance { pointer-events: auto; }
.entrance {
  position: absolute; bottom: 0;
  display: block; padding: 0; margin: 0;
  transform-origin: 50% 100%;
  transition: transform .5s var(--ease), filter .5s var(--ease);
  touch-action: manipulation;
}
.entrance-svg { width: 100%; height: 100%; overflow: visible; }
.entrance .ww-door-open { transition: filter .5s var(--ease); }
/* Grows from its own base, so the doorway can never slide out from under
   the cursor and start a hover/unhover flicker. No filter: it forces a
   repaint of the whole layer on a machine that can least afford it. */
.entrance:hover, .entrance:focus-visible, .entrance.is-near { transform: scale(1.035); }
.entrance:hover .entrance-label, .entrance:focus-visible .entrance-label,
.entrance.is-near .entrance-label { opacity: 1; transform: translate(-50%, 0); }

/* the small permanent "this is a door you can walk through" cue */
.entrance-cta {
  position: absolute; left: 50%; bottom: 1.5%;
  transform: translate(-50%, 0);
  display: inline-flex; align-items: center; gap: .5em;
  padding: .42em .95em .46em; border-radius: 999px;
  font-size: .56em; letter-spacing: .2em; text-transform: uppercase;
  color: var(--terra-deep); background: rgba(251,244,232,.92);
  border: 1px solid rgba(155,74,42,.3);
  box-shadow: 0 6px 18px -9px rgba(59,42,34,.6);
  white-space: nowrap; pointer-events: none;
  transition: background .35s var(--ease), color .35s var(--ease), transform .35s var(--ease);
}
.entrance-cta::before {
  content: ""; width: .5em; height: .5em; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 .16em rgba(228,168,83,.35);
}
.entrance:hover .entrance-cta, .entrance:focus-visible .entrance-cta,
.entrance.is-near .entrance-cta {
  background: var(--terracotta); color: var(--cream-2); border-color: var(--terracotta);
  transform: translate(-50%, -3px);
}
/* labels sit above the archway, clear of the path map at the bottom */
.entrance-label {
  position: absolute; left: 50%; top: -5.6em; bottom: auto;
  transform: translate(-50%, 10px);
  opacity: 0; transition: opacity .45s var(--ease), transform .45s var(--ease);
  text-align: center; white-space: nowrap; pointer-events: none;
}
.entrance-label > span { display: block; }
.entrance-label .inner {
  padding: .6em 1.4em .7em; border-radius: 14px;
  background: rgba(251,244,232,.93);
  border: 1px solid rgba(59,42,34,.08);
  box-shadow: 0 10px 30px -14px rgba(59,42,34,.5);
}
.entrance-label .num {
  display: block; font-family: var(--display); font-size: .82em;
  letter-spacing: .3em; color: var(--terra-deep); opacity: .8;
}
.entrance-label .name {
  display: block; font-family: var(--display); font-size: 1.5em; line-height: 1.15;
  color: var(--espresso);
}
.entrance-label .sub {
  display: block; font-size: .62em; letter-spacing: .2em; text-transform: uppercase;
  color: var(--esp-soft); margin-top: .3em;
}

/* --- 6 · rooms ----------------------------------------------------------- */
#room {
  position: absolute; inset: 0; overflow: hidden;
  visibility: hidden; opacity: 0;
  background: var(--night);
}
#room.is-open { visibility: visible; opacity: 1; }
.room-art { position: absolute; inset: -4%; }
.room-layer {
  position: absolute; inset: 0;
  will-change: transform;
}
.room-layer > svg { width: 100%; height: 100%; }
.room-scrim {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, rgba(59,42,34,0) 38%, rgba(59,42,34,.28) 78%);
}

/* --- 7 · the content panel ----------------------------------------------- */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  display: flex; flex-direction: column;
  background: var(--panel-bg);
  backdrop-filter: blur(14px) saturate(1.1);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.panel-grip { display: none; }
.panel-scroll {
  overflow-y: auto; overscroll-behavior: contain;
  outline-offset: -6px;
  padding: clamp(2rem, 4vw, 3.4rem) clamp(1.6rem, 3.2vw, 3rem) 4rem;
  -webkit-overflow-scrolling: touch;
}
.panel-kicker {
  font-size: .68rem; letter-spacing: .34em; text-transform: uppercase;
  color: var(--terra-deep); margin: 0 0 .8rem;
}
.panel-title {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2.4rem, 4.6vw, 3.6rem); line-height: 1.02;
  margin: 0 0 .7rem; color: var(--espresso);
}
.panel-rule { width: 54px; height: 1px; background: var(--terracotta); margin: 1.2rem 0 1.4rem; }
.panel-intro {
  font-family: var(--display); font-size: clamp(1.12rem, 1.7vw, 1.36rem);
  line-height: 1.6; color: var(--esp-soft); font-style: italic; margin: 0 0 2rem;
}

.facts { list-style: none; margin: 0 0 2.2rem; padding: 0; }
.facts li {
  display: grid; grid-template-columns: 8.4rem 1fr; gap: 1rem;
  padding: .85rem 0; border-top: 1px solid var(--panel-line);
  font-size: .95rem; line-height: 1.55;
}
.facts li:last-child { border-bottom: 1px solid var(--panel-line); }
.facts dt, .facts .k {
  font-size: .66rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--terra-deep); padding-top: .28em;
}
.facts .v { color: var(--espresso); }

.note {
  background: rgba(196,100,60,.08);
  border-left: 2px solid var(--terracotta);
  padding: 1.3rem 1.4rem; margin: 0 0 2.2rem; border-radius: 0 8px 8px 0;
}
.note h3 {
  margin: 0 0 .6rem; font-family: var(--display); font-weight: 500;
  font-size: 1.22rem; letter-spacing: .01em;
}
.note p { margin: 0; font-size: .95rem; line-height: 1.72; color: var(--esp-soft); }

.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.6rem; }
.filter {
  padding: .6rem 1.05rem; min-height: 40px;
  border: 1px solid var(--panel-line); border-radius: 999px;
  font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--esp-soft);
  transition: all .3s var(--ease);
}
.filter:hover { border-color: var(--terracotta); color: var(--terra-deep); }
.filter.is-on { background: var(--terracotta); border-color: var(--terracotta); color: var(--cream-2); }

.cards { display: grid; gap: .9rem; margin: 0 0 2.2rem; }
.card {
  border: 1px solid var(--panel-line); border-radius: 12px;
  padding: 1.15rem 1.25rem; background: rgba(255,255,255,.42);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
}
.card.is-hidden { display: none; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(196,100,60,.4); }
.card h4 { margin: 0 0 .45rem; font-family: var(--display); font-size: 1.3rem; font-weight: 500; }
.card p { margin: 0 0 .7rem; font-size: .92rem; line-height: 1.68; color: var(--esp-soft); }
.card .meta {
  display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--terra-deep);
}
.card .card-link {
  display: inline-flex; align-items: center; gap: .4rem; margin-top: .7rem;
  font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--terra-deep); text-decoration: none; border-bottom: 1px solid rgba(155,74,42,.35);
  padding-bottom: 2px; min-height: 24px;
}
.card .card-link:hover { border-bottom-color: var(--terra-deep); }
.card .pin {
  display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: .5rem;
  border-radius: 50%; background: var(--terracotta); color: var(--cream-2);
  font-family: var(--display); font-size: .82rem; vertical-align: 2px;
}
.links { display: flex; flex-wrap: wrap; gap: .7rem; margin-bottom: 2rem; }
.link-btn {
  display: inline-flex; align-items: center; min-height: 44px; padding: .7rem 1.3rem;
  border: 1px solid var(--terra-deep); border-radius: 999px; text-decoration: none;
  font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--terra-deep);
  transition: background .3s var(--ease), color .3s var(--ease);
}
.link-btn:hover { background: var(--terra-deep); color: var(--cream-2); }

/* --- 8 · RSVP form ------------------------------------------------------- */
.form-grid { display: grid; gap: 1.1rem; }
.field { display: grid; gap: .4rem; }
.field label, .fieldset > legend {
  font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: var(--terra-deep);
}
.field input[type="text"], .field input[type="email"], .field select, .field textarea {
  width: 100%; min-height: 48px; padding: .8rem .95rem;
  border: 1px solid var(--panel-line); border-radius: 8px;
  background: rgba(255,255,255,.7); color: var(--espresso);
  font-family: var(--body); font-size: 1rem;
  transition: border-color .3s var(--ease), background .3s var(--ease);
}
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--terracotta); background: #fff; outline: none;
}
.fieldset { border: 1px solid var(--panel-line); border-radius: 10px; padding: 1.1rem 1.2rem; margin: 0; }
.fieldset > legend { padding: 0 .5rem; }
.choice {
  display: flex; align-items: flex-start; gap: .75rem; padding: .6rem 0; min-height: 44px;
  font-size: .95rem; line-height: 1.4; cursor: pointer;
}
.choice input { width: 20px; height: 20px; margin-top: .15rem; accent-color: var(--terracotta); flex: none; }
.choice .c-sub { display: block; font-size: .76rem; color: var(--esp-soft); margin-top: .15rem; }
.field-error { font-size: .78rem; color: #A8341F; min-height: 1em; }
.submit-btn {
  margin-top: .6rem; min-height: 54px; padding: 1rem 2rem;
  background: var(--terracotta); color: var(--cream-2); border-radius: 999px;
  font-size: .76rem; letter-spacing: .24em; text-transform: uppercase;
  transition: background .3s var(--ease), transform .3s var(--ease);
}
.submit-btn:hover { background: var(--terra-deep); transform: translateY(-2px); }
.submit-btn[disabled] { opacity: .6; pointer-events: none; }
.form-done { text-align: center; padding: 2rem 0; }
.form-done .seal {
  width: 74px; height: 74px; margin: 0 auto 1.2rem; border-radius: 50%;
  background: var(--terracotta); color: var(--cream-2);
  display: grid; place-items: center; font-family: var(--display); font-size: 2rem;
  box-shadow: 0 0 0 8px rgba(196,100,60,.16);
}
.form-done h3 { font-family: var(--display); font-size: 1.9rem; font-weight: 400; margin: 0 0 .5rem; }
.form-done p { color: var(--esp-soft); line-height: 1.7; margin: 0 0 1.2rem; }

/* --- 9 · persistent UI --------------------------------------------------- */
.top-bar::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(249,238,220,.72), rgba(249,238,220,0));
  -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent);
          mask-image: linear-gradient(180deg, #000 40%, transparent);
}
.top-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.4rem clamp(1.1rem, 3vw, 2.4rem);
  pointer-events: none;
}
.brand { pointer-events: auto; text-align: left; transition: opacity .5s var(--ease); }
/* inside a room the way back owns the top of the screen, so the names step
   aside — the room has its own title, and nobody is lost */
#room.is-open ~ .top-bar .brand { opacity: 0; pointer-events: none; }
.brand .n {
  display: block; font-family: var(--display); font-size: clamp(1.15rem, 2vw, 1.5rem);
  color: var(--espresso); letter-spacing: .04em;
  text-shadow: 0 2px 16px rgba(244,231,211,.85);
}
.brand .d {
  display: block; font-size: .6rem; letter-spacing: .28em; text-transform: uppercase;
  color: var(--terra-deep); margin-top: .18rem;
  text-shadow: 0 2px 12px rgba(244,231,211,.8);
}
.top-actions { display: flex; gap: .6rem; pointer-events: auto; }
.icon-btn {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(251,244,232,.88);
  border: 1px solid rgba(59,42,34,.12);
  box-shadow: var(--shadow-md);
  transition: transform .3s var(--ease), background .3s var(--ease);
}
.icon-btn:hover { transform: translateY(-2px); background: rgba(251,244,232,.95); }
.icon-btn svg { width: 20px; height: 20px; }

/* the always-available RSVP lantern */
.beacon {
  position: absolute; z-index: 45;
  right: clamp(1.1rem, 3vw, 2.4rem); bottom: clamp(5.6rem, 9vh, 7rem);
  display: flex; align-items: center; gap: .7rem;
  padding: .7rem .7rem .7rem 1.3rem; min-height: 56px;
  border-radius: 999px;
  background: linear-gradient(120deg, rgba(228,168,83,.96), rgba(196,100,60,.96));
  color: #FFF8EA; box-shadow: 0 10px 40px -8px rgba(196,100,60,.7);
  transition: transform .4s var(--ease), box-shadow .4s var(--ease), opacity .5s var(--ease);
}
.beacon:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 50px -10px rgba(196,100,60,.85); }
.beacon .t { font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; }
.beacon .flame {
  position: relative; width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #FFF6DC, #F5D08A 45%, rgba(245,208,138,0) 72%);
  display: grid; place-items: center;
}
.beacon .flame::after {
  content: ""; width: 11px; height: 15px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: #FFF3D0; box-shadow: 0 0 14px 5px rgba(255,236,180,.9);
  animation: ww-flicker 2.6s ease-in-out infinite;
}
.beacon::before {
  content: ""; position: absolute; inset: -6px; border-radius: 999px;
  border: 1px solid rgba(245,208,138,.65);
  animation: beacon-ring 3.4s var(--ease) infinite;
}
@keyframes beacon-ring {
  0%   { transform: scale(1);    opacity: .8; }
  70%  { transform: scale(1.22); opacity: 0; }
  100% { transform: scale(1.22); opacity: 0; }
}
.beacon.is-hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }

/* the little path map along the bottom */
.pathmap {
  position: absolute; z-index: 40; left: 50%; bottom: clamp(1.1rem, 2.6vh, 1.9rem);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: .2rem;
  padding: .5rem .8rem; border-radius: 999px;
  background: rgba(251,244,232,.9);
  border: 1px solid rgba(59,42,34,.1); box-shadow: var(--shadow-md);
  transition: opacity .5s var(--ease);
  max-width: calc(100vw - 2rem);
}
.pathmap.is-hidden { opacity: 0; pointer-events: none; }
.dot {
  position: relative; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
}
.dot i {
  display: block; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(59,42,34,.3); transition: all .35s var(--ease);
}
.dot:hover i { background: var(--terracotta); transform: scale(1.35); }
.dot.is-on i { background: var(--terracotta); width: 22px; border-radius: 999px; }
.dot .tip {
  position: absolute; bottom: 130%; left: 50%; transform: translate(-50%, 6px);
  padding: .35rem .65rem; border-radius: 6px; white-space: nowrap;
  background: var(--espresso); color: var(--cream);
  font-size: .62rem; letter-spacing: .14em; text-transform: uppercase;
  opacity: 0; pointer-events: none; transition: all .3s var(--ease);
}
.dot:hover .tip, .dot:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }

/* back out of a room */
.back-btn {
  position: absolute; z-index: 46; left: clamp(1.1rem, 3vw, 2.4rem); bottom: clamp(1.4rem, 4vh, 2.6rem);
  display: inline-flex; align-items: center; gap: .8rem;
  padding: .85rem 1.6rem .85rem 1.1rem; min-height: 52px;
  border-radius: 999px; background: rgba(251,244,232,.9); backdrop-filter: blur(10px);
  border: 1px solid rgba(59,42,34,.12); box-shadow: var(--shadow-md);
  color: var(--espresso);
  font-size: .7rem; letter-spacing: .22em; text-transform: uppercase;
  transition: transform .35s var(--ease), background .35s var(--ease);
}
.back-btn:hover { transform: translateX(-4px); background: #fff; }
.back-btn .arrow { display: block; width: 22px; height: 10px; }

/* room-to-room stepper inside the panel */
.room-nav {
  display: flex; justify-content: space-between; gap: 1rem;
  border-top: 1px solid var(--panel-line); margin-top: 1rem; padding-top: 1.4rem;
}
.room-nav button {
  display: grid; gap: .2rem; min-height: 48px; padding: .5rem .2rem;
  font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--terra-deep);
}
.room-nav .rn-name { font-family: var(--display); font-size: 1.06rem; letter-spacing: .01em; text-transform: none; color: var(--espresso); }
.room-nav .rn-next { text-align: right; }
.room-nav button:hover .rn-name { color: var(--terracotta); }
.room-nav button[disabled] { opacity: .3; pointer-events: none; }

/* the transition veil */
#veil {
  position: absolute; inset: 0; z-index: 60; pointer-events: none;
  background: radial-gradient(circle at var(--vx, 50%) var(--vy, 50%), rgba(255,241,214,.98) 0%, rgba(244,231,211,.96) 42%, rgba(196,100,60,.9) 100%);
  opacity: 0;
}

/* first-visit hint */
.hint {
  position: absolute; z-index: 42; left: 50%; bottom: clamp(4.6rem, 8.4vh, 6.2rem);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: .7rem;
  font-size: .64rem; letter-spacing: .26em; text-transform: uppercase; color: var(--esp-soft);
  text-shadow: 0 2px 12px rgba(244,231,211,.9);
  transition: opacity .8s var(--ease);
  white-space: nowrap; pointer-events: none;
  padding: .55rem 1.1rem; border-radius: 999px;
  background: rgba(251,244,232,.88);
  border: 1px solid rgba(59,42,34,.08);
}
.hint.is-gone { opacity: 0; }
.hint .swipe { display: block; width: 46px; height: 12px; }

/* drifting motes of light */
.particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.mote {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,246,220,.95), rgba(245,208,138,0) 70%);
  animation: mote-float linear infinite;
}
@keyframes mote-float {
  0%   { transform: translate3d(0, 0, 0) scale(.6); opacity: 0; }
  12%  { opacity: .9; }
  88%  { opacity: .7; }
  100% { transform: translate3d(var(--dx, 40px), -108vh, 0) scale(1.15); opacity: 0; }
}

/* --- 10 · ambient motion -------------------------------------------------
   Every idle animation in the world carries one of these classes. While the
   camera is actually moving they are all paused: nobody can see a lantern
   flicker during a 1.4s dolly, and pausing them stops the browser repainting
   several very large SVG layers on every single frame. This is the single
   biggest thing keeping the pan smooth on a laptop or an Android phone. */
#hub.is-moving .ww-sway, #hub.is-moving .ww-sway-slow, #hub.is-moving .ww-swing,
#hub.is-moving .ww-flicker, #hub.is-moving .ww-twinkle, #hub.is-moving .ww-shimmer,
#hub.is-moving .ww-drift, #hub.is-moving .ww-bob, #hub.is-moving .ww-hover-bob,
#hub.is-moving .ww-pulse, #hub.is-moving .ww-glow-soft, #hub.is-moving .ww-dance,
#hub.is-moving .ww-fly, #hub.is-moving .ww-flap, #hub.is-moving .ww-spin-slow,
#hub.is-moving .ww-plane, #hub.is-moving .ww-plane-door, #hub.is-moving .ww-idle,
#hub.is-moving .ww-talk, #hub.is-moving .ww-laugh, #hub.is-moving .ww-stroll {
  animation-play-state: paused;
}
#stage.is-moving .mote { animation-play-state: paused; }

.ww-sway      { animation: ww-sway 6.5s ease-in-out infinite; transform-box: fill-box; }
.ww-sway-slow { animation: ww-sway 13s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-sway {
  0%, 100% { transform: rotate(-1.4deg); }
  50%      { transform: rotate(1.4deg); }
}
.ww-swing { animation: ww-swing 5.4s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-swing {
  0%, 100% { transform: rotate(-3.4deg); }
  50%      { transform: rotate(3.4deg); }
}
.ww-flicker { animation: ww-flicker 3.1s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-flicker {
  0%, 100% { opacity: 1;   transform: scaleY(1); }
  35%      { opacity: .74; transform: scaleY(.93); }
  62%      { opacity: .95; transform: scaleY(1.05); }
  80%      { opacity: .8;  transform: scaleY(.97); }
}
.ww-twinkle { animation: ww-twinkle 3.6s ease-in-out infinite; }
@keyframes ww-twinkle { 0%, 100% { opacity: .95; } 50% { opacity: .34; } }
.ww-shimmer { animation: ww-shimmer 7s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-shimmer {
  0%, 100% { opacity: .12; transform: translateX(0); }
  50%      { opacity: .6;  transform: translateX(9px); }
}
.ww-drift { animation-name: ww-drift; animation-timing-function: linear; animation-iteration-count: infinite; transform-box: fill-box; }
@keyframes ww-drift { from { transform: translateX(-8%); } to { transform: translateX(108%); } }
.ww-bob { animation: ww-bob 4.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-bob {
  0%, 100% { transform: translateY(0)    rotate(-1deg); }
  50%      { transform: translateY(-4px) rotate(1deg); }
}
.ww-hover-bob { animation: ww-hover-bob 3.8s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-hover-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.ww-pulse { animation: ww-pulse 5.2s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-pulse { 0%, 100% { opacity: .78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
.ww-glow-soft { animation: ww-glow 7.5s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-glow { 0%, 100% { opacity: .45; } 50% { opacity: .78; } }
.ww-dance { animation: ww-dance 1.9s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-dance {
  0%, 100% { transform: translateY(0) rotate(-3deg) scaleY(1); }
  25%      { transform: translateY(-9px) rotate(0deg) scaleY(1.03); }
  50%      { transform: translateY(0) rotate(3deg) scaleY(1); }
  75%      { transform: translateY(-6px) rotate(0deg) scaleY(1.02); }
}
.ww-fly { animation: ww-fly 46s linear infinite; transform-box: fill-box; }
@keyframes ww-fly { from { transform: translate(-10%, 14px); } to { transform: translate(120%, -34px); } }
.ww-flap { animation: ww-flap 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ww-flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.4); } }
.ww-spin-slow { animation: ww-spin 22s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-spin { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.ww-idle { animation: ww-idle 5.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
.ww-talk { animation: ww-talk 3.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-talk { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
.ww-laugh { animation: ww-laugh 2.9s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-laugh {
  0%, 100% { transform: rotate(-1.6deg) translateY(0); }
  50%      { transform: rotate(2.2deg) translateY(-2.5px); }
}
.ww-stroll { animation: ww-stroll 19s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-stroll { 0%, 100% { transform: translateX(-26px); } 50% { transform: translateX(34px); } }
.ww-plane-door { animation: ww-plane-door 15s ease-in-out infinite; transform-box: fill-box; }
@keyframes ww-plane-door {
  0%   { transform: translate(-26px, 16px); opacity: 0; }
  14%  { opacity: 1; }
  82%  { opacity: 1; }
  100% { transform: translate(40px, -18px); opacity: 0; }
}
.ww-plane { animation: ww-plane 34s linear infinite; }
@keyframes ww-plane {
  from { transform: translate(-320px, 150px); }
  to   { transform: translate(1900px, 60px); }
}

/* --- 11 · mobile & tablet ------------------------------------------------ */
@media (max-width: 900px) {
  :root { --panel-w: 100%; --sheet-min: 34dvh; --sheet-max: 88dvh; }
  /* On a phone the illustration keeps two thirds of the screen and the copy
     arrives as a bottom sheet you can pull up. The artwork is drawn to the
     full width and anchored to the foot of its band, with the room's own sky
     colour continuing above it — so nothing is cropped away sideways. */
  #room { background: var(--room-sky, var(--night)); }
  .room-art {
    inset: 0 0 auto 0; height: 66vh; height: 66dvh;
    background: var(--room-sky, var(--night));
  }
  .room-layer > svg {
    position: absolute; left: -20%; right: -20%; bottom: 0;
    width: 140%; height: auto;
  }
  .room-scrim {
    inset: 0 0 auto 0; height: 66vh; height: 66dvh;
    background: linear-gradient(180deg, rgba(59,42,34,.30) 0%, rgba(59,42,34,0) 34%);
  }
  .panel {
    top: auto; bottom: 0;
    height: var(--sheet-h, 34dvh);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -18px 60px -20px rgba(59,42,34,.6);
    transition: transform .95s var(--ease), opacity .7s var(--ease), height .42s var(--ease);
  }
  .panel.is-dragging { transition: none; }
  /* the pull tab — a proper 44px target, not just a decorative line */
  .panel-grip {
    position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 2;
    display: grid; place-items: center; cursor: grab;
    touch-action: none;
  }
  .panel-grip::before {
    content: ""; width: 46px; height: 4px; border-radius: 999px;
    background: rgba(59,42,34,.26);
    transition: width .3s var(--ease), background .3s var(--ease);
  }
  .panel-grip:active::before { background: var(--terracotta); width: 62px; }
  .panel-scroll { padding: 2.1rem 1.5rem 7rem; }
  /* collapsed, the whole sheet is a handle: drag anywhere on it to open */
  .panel:not(.is-expanded) .panel-scroll { overflow-y: hidden; touch-action: none; }
  .back-btn { bottom: auto; top: 1.1rem; left: 1.1rem; padding: .7rem 1.2rem .7rem .9rem; min-height: 46px; }
  .beacon { bottom: 4.9rem; padding: .6rem .6rem .6rem 1.1rem; min-height: 52px; }
  .entrance-cta { font-size: .68em; letter-spacing: .14em; }
  .beacon .t { font-size: .64rem; letter-spacing: .18em; }
  .facts li { grid-template-columns: 1fr; gap: .25rem; }
  .top-bar { padding: 1rem 1.1rem; }
  .hint { bottom: 4.2rem; font-size: .58rem; letter-spacing: .2em; }
  .pathmap { gap: 0; padding: .4rem .5rem; }
  .dot { width: 30px; height: 30px; }
}
@media (max-width: 560px) {
  .brand .n { font-size: 1.05rem; }
  .brand .d .place { display: none; }
  .brand .d { font-size: .55rem; }
  .beacon .t { display: none; }
  .beacon { padding: .55rem; border-radius: 50%; min-height: 54px; }
  .entrance-label .name { font-size: 1.25em; }
}
@media (min-width: 901px) {
  .panel { border-left: 1px solid rgba(59,42,34,.1); }

  /* The names used to sit in the top-left corner, where the foreground
     olive branch hangs into the frame and ate them. Centre them, and give
     them a plaque so they never have to compete with the artwork. */
  .brand {
    position: absolute; left: 50%; top: 0;
    transform: translateX(-50%); text-align: center;
    padding: .85rem 2.2rem .95rem; border-radius: 0 0 18px 18px;
    background: linear-gradient(180deg, rgba(251,244,232,.94), rgba(251,244,232,.6));
    border: 1px solid rgba(59,42,34,.09); border-top: 0;
    box-shadow: 0 14px 34px -22px rgba(59,42,34,.65);
    transition: transform .8s var(--ease);
  }
  .brand .n { font-size: clamp(1.3rem, 2.1vw, 1.7rem); text-shadow: none; }
  .brand .d { font-size: .62rem; text-shadow: none; letter-spacing: .3em; }

  /* one clear way back, top left, where a back control belongs */
  .back-btn { top: 1.25rem; bottom: auto; }
  /* keep the sound toggle clear of the panel while a room is open */
  #room.is-open ~ .top-bar .top-actions {
    transform: translateX(calc(-1 * var(--panel-w) - .6rem));
    transition: transform .8s var(--ease);
  }
  .top-actions { transition: transform .8s var(--ease); }
}

/* --- 12 · reduced motion / print ----------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .particles { display: none; }
}
@media print {
  #hub, #veil, .particles, .beacon, .pathmap, .hint { display: none !important; }
  .panel { position: static; width: 100%; box-shadow: none; background: #fff; }
  html, body { overflow: visible; height: auto; }
}

/* --- 13 · arrival animations (added last so they win on specificity) ----- */
.room-art { opacity: 0; transform: scale(1.07); transition: opacity .9s var(--ease), transform 1.5s var(--ease); }
#room.is-open .room-art { opacity: 1; transform: scale(1); }
.panel { transform: translateX(40px); opacity: 0; transition: transform .95s var(--ease), opacity .7s var(--ease); }
#room.is-open .panel { transform: none; opacity: 1; }
@media (max-width: 900px) {
  .panel { transform: translateY(60px); }
}
/* The reveal is an enhancement, never a gate: content is visible unless
   .is-entering is present, and app.js always removes that class. */
.panel-scroll.is-entering > * {
  opacity: 0; transform: translateY(16px);
  animation: rise .8s var(--ease) forwards;
  animation-delay: calc(260ms + var(--i, 0) * 65ms);
}
@keyframes rise { to { opacity: 1; transform: none; } }
.back-btn { opacity: 0; transform: translateY(10px); transition: opacity .6s var(--ease) .5s, transform .6s var(--ease) .5s, background .3s; }
#room.is-open .back-btn { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .panel-scroll.is-entering > * { opacity: 1; transform: none; animation: none; }
  .room-art, .panel { opacity: 1; transform: none; }
}

<div id="stage">

  <!-- ============ THE MAIN PATHWAY ============ -->

    </button>

  <!-- ============ PERSISTENT UI ============ -->
  <div class="top-bar">

          <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="m17 10 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none">
          <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

  <!-- the lantern: RSVP from anywhere, at any point in the walk -->
  <button class="beacon" id="beacon" type="button" aria-label="Go straight to the RSVP">

    Drag, scroll or use ← → to walk
  </div>

  <div id="veil" aria-hidden="true"></div>
</div>

<!-- ============ LOADING / WELCOME ============ -->
<div id="loader">
  <p class="loader-sub" id="loader-sub">&nbsp;</p>
  <h1 class="loader-names" id="loader-names">&nbsp;</h1>
  <p class="loader-note" id="loader-note">&nbsp;</p>
  <div class="loader-bar"><i id="loader-bar"></i></div>
  <button class="enter-btn" id="enter-btn" type="button">Begin the walk</button>
  <noscript>
    <p style="max-width:40ch;color:#9B4A2A">This site needs JavaScript to draw the illustrated world.
    If you cannot use it, please email us and we will send you all the details by return.</p>

<script>
/* ==========================================================================
   tween.js — a tiny animation engine (no dependencies)
   Replaces GSAP so the site works offline, from a USB stick, or by simply
   double-clicking index.html. Same easing curves (power2.inOut etc).
   ========================================================================== */
(function (global) {
  'use strict';

  var Ease = {
    linear:      function (t) { return t; },
    power1In:    function (t) { return t * t; },
    power1Out:   function (t) { return 1 - (1 - t) * (1 - t); },
    power2In:    function (t) { return t * t * t; },
    power2Out:   function (t) { return 1 - Math.pow(1 - t, 3); },
    power2InOut: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    power3InOut: function (t) { return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2; },
    backOut:     function (t) { var c1 = 1.70158, c3 = c1 + 1;
                                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    expoOut:     function (t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  };

  var running = [];
  var ticking = false;

  function frame(now) {
    ticking = false;
    for (var i = running.length - 1; i >= 0; i--) {
      var tw = running[i];
      if (tw.killed) { running.splice(i, 1); continue; }
      if (tw.start === null) tw.start = now + tw.delay;
      var elapsed = now - tw.start;
      if (elapsed < 0) { continue; }
      var t = tw.duration <= 0 ? 1 : Math.min(1, elapsed / tw.duration);
      var e = tw.ease(t);
      tw.onUpdate(tw.from + (tw.to - tw.from) * e, e, t);
      if (t >= 1) {
        running.splice(i, 1);
        if (tw.onComplete) tw.onComplete();
      }
    }
    if (running.length) schedule();
  }

  function schedule() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(frame);
  }

  /**
   * tween({from, to, duration, delay, ease, onUpdate, onComplete}) -> handle
   * Durations are in milliseconds.
   */
  function tween(opts) {
    var tw = {
      from: opts.from != null ? opts.from : 0,
      to: opts.to != null ? opts.to : 1,
      duration: opts.duration != null ? opts.duration : 600,
      delay: opts.delay || 0,
      ease: typeof opts.ease === 'function' ? opts.ease : (Ease[opts.ease] || Ease.power2InOut),
      onUpdate: opts.onUpdate || function () {},
      onComplete: opts.onComplete || null,
      start: null,
      killed: false
    };
    // Respect the visitor's "reduce motion" system setting: snap to the end.
    if (global.WW_REDUCED_MOTION && !opts.ignoreReducedMotion) {
      tw.duration = 0;
      tw.delay = 0;
    }
    running.push(tw);
    schedule();
    return {
      kill: function () { tw.killed = true; },
      finish: function () {
        tw.killed = true;
        tw.onUpdate(tw.to, 1, 1);
        if (tw.onComplete) tw.onComplete();
      }
    };
  }

  /** Frame-rate independent smoothing, for pointer-follow / inertia. */
  function damp(current, target, lambda, dt) {
    return current + (target - current) * (1 - Math.exp(-lambda * dt));
  }

  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

  /* If the guest switches tab mid-transition the browser pauses
     requestAnimationFrame. Snap everything to its end state so nothing is
     left half-open when they come back. */

    g += '<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(w) + '" height="' + f(h) + '" fill="url(#' + id + ')"/>';
    var r = rand(glintSeed || 11), gl = '';
    var n = Math.round(w / 40);
    for (var i = 0; i < n; i++) {
      var gx = x + r() * w;
      var gy = y + Math.pow(r(), 1.7) * h;
      var gw = 10 + r() * 46;
      var lively = i % 3 !== 0;                 // most of them just sit there
      gl += '<rect' + (lively ? ' class="ww-shimmer"' : '') +
            ' x="' + f(gx) + '" y="' + f(gy) + '" width="' + f(gw) + '" height="' + f(1.6 + r() * 1.8) +
            '" rx="1" fill="' + (glintColor || '#FFFFFF') + '" opacity="' + (0.06 + r() * 0.22).toFixed(2) +
            '"' + (lively ? ' style="animation-delay:' + (-r() * 9).toFixed(1) + 's"' : '') + '/>';
    }
    return g + gl;
  }

  /* Sun or moon, with a soft halo. */
  function sun(cx, cy, r0, core, halo) {
    var id = uid('sun');
    return '<defs><radialGradient id="' + id + '"><stop offset="0" stop-color="' + halo + '" stop-opacity=".85"/>' +
      '<stop offset="1" stop-color="' + halo + '" stop-opacity="0"/></radialGradient></defs>' +
      '<circle cx="' + f(cx) + '" cy="' + f(cy) + '" r="' + f(r0 * 5.2) + '" fill="url(#' + id + ')"/>' +
      '<circle class="ww-pulse" cx="' + f(cx) + '" cy="' + f(cy) + '" r="' + f(r0) + '" fill="' + core + '"/>';
  }

  function clouds(w, h, seed, color, opacity, yBand) {
    var r = rand(seed || 5), g = '';
    var n = Math.round(w / 420);
    for (var i = 0; i < n; i++) {
      var cx = r() * w, cy = (yBand ? yBand[0] : 60) + r() * ((yBand ? yBand[1] : h * 0.3) - (yBand ? yBand[0] : 60));
      var s = 0.6 + r() * 1.1, puffs = 4 + Math.round(r() * 3), c = '';
      for (var j = 0; j < puffs; j++) {
        c += '<ellipse cx="' + f(cx + (j - puffs / 2) * 44 * s + r() * 18) + '" cy="' + f(cy + (r() - 0.5) * 16 * s) +
             '" rx="' + f((36 + r() * 34) * s) + '" ry="' + f((15 + r() * 11) * s) + '" fill="' + color + '"/>';
      }
      g += '<g class="ww-drift" style="animation-duration:' + f(70 + r() * 90) + 's;animation-delay:' + f(-r() * 90) + 's" opacity="' + (opacity * (0.6 + r() * 0.4)).toFixed(2) + '">' + c + '</g>';
    }
    return g;
  }

  function birds(x, y, s, count, seed, color) {
    var r = rand(seed || 9), g = '';
    for (var i = 0; i < (count || 5); i++) {
      var bx = x + r() * 260 * s, by = y + r() * 90 * s, bs = (0.7 + r() * 0.6) * s;
      g += '<path class="ww-flap" d="M ' + f(bx) + ' ' + f(by) + ' q ' + f(6 * bs) + ' -' + f(5 * bs) + ' ' + f(12 * bs) + ' 0 M ' +
           f(bx + 12 * bs) + ' ' + f(by) + ' q ' + f(6 * bs) + ' -' + f(5 * bs) + ' ' + f(12 * bs) + ' 0" ' +
           'fill="none" stroke="' + (color || 'rgba(59,42,34,.5)') + '" stroke-width="' + f(1.6 * bs) + '" stroke-linecap="round" ' +
           'style="animation-delay:' + (-r() * 3).toFixed(1) + 's"/>';
    }
    return '<g class="ww-fly" style="animation-delay:' + (-r() * 30).toFixed(1) + 's">' + g + '</g>';
  }

  /* Hanging lantern with a living flame. */
  function lantern(x, y, s, cordTo) {
    var id = uid('lan');
    var g = '<line x1="' + f(x) + '" y1="' + f(cordTo != null ? cordTo : y - 46 * s) + '" x2="' + f(x) + '" y2="' + f(y - 12 * s) + '" stroke="rgba(59,42,34,.55)" stroke-width="' + f(1.4 * s) + '"/>';
    g += '<defs><radialGradient id="' + id + '"><stop offset="0" stop-color="' + P.goldLight + '" stop-opacity=".95"/>' +
      '<stop offset=".45" stop-color="' + P.gold + '" stop-opacity=".45"/><stop offset="1" stop-color="' + P.gold + '" stop-opacity="0"/></radialGradient></defs>';
    g += '<circle class="ww-flicker" cx="' + f(x) + '" cy="' + f(y + 4 * s) + '" r="' + f(30 * s) + '" fill="url(#' + id + ')"/>';
    g += '<path d="M ' + f(x - 7 * s) + ' ' + f(y - 10 * s) + ' l ' + f(14 * s) + ' 0 l ' + f(2.5 * s) + ' ' + f(21 * s) + ' l -' + f(19 * s) + ' 0 Z" fill="rgba(59,42,34,.72)"/>';
    g += '<path d="M ' + f(x - 4.5 * s) + ' ' + f(y - 7 * s) + ' l ' + f(9 * s) + ' 0 l ' + f(1.6 * s) + ' ' + f(15 * s) + ' l -' + f(12 * s) + ' 0 Z" fill="' + P.goldLight + '" class="ww-flicker"/>';
    return '<g class="ww-swing" style="transform-origin:' + f(x) + 'px ' + f(cordTo != null ? cordTo : y - 46 * s) + 'px">' + g + '</g>';
  }

  /* A sagging run of festoon bulbs. */
  function stringLights(x1, y1, x2, y2, sag, n, seed) {
    var r = rand(seed || 13);
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag;
    var g = '<path d="M ' + f(x1) + ' ' + f(y1) + ' Q ' + f(mx) + ' ' + f(my) + ' ' + f(x2) + ' ' + f(y2) + '" fill="none" stroke="rgba(59,42,34,.45)" stroke-width="1.6"/>';
    for (var i = 1; i < n; i++) {
      var t = i / n;
      var bx = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * mx + t * t * x2;
      var by = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * my + t * t * y2;
      g += '<line x1="' + f(bx) + '" y1="' + f(by) + '" x2="' + f(bx) + '" y2="' + f(by + 7) + '" stroke="rgba(59,42,34,.4)" stroke-width="1.2"/>';
      g += '<circle class="ww-twinkle" cx="' + f(bx) + '" cy="' + f(by + 11) + '" r="3.6" fill="' + P.goldLight + '" style="animation-delay:' + (-r() * 4).toFixed(2) + 's"/>';
      g += '<circle class="ww-twinkle" cx="' + f(bx) + '" cy="' + f(by + 11) + '" r="9" fill="' + P.gold + '" opacity=".28" style="animation-delay:' + (-r() * 4).toFixed(2) + 's"/>';
    }
    return g;
  }

  /* Dry-stone wall / terrace edge. */
  function stoneWall(x, y, w, h, seed, fill, mortar) {
    var r = rand(seed || 17);
    var g = '<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(w) + '" height="' + f(h) + '" fill="' + (fill || P.stoneDeep) + '"/>';
    var rows = Math.max(2, Math.round(h / 16));
    for (var i = 0; i < rows; i++) {
      var ry = y + (h / rows) * i;
      g += '<line x1="' + f(x) + '" y1="' + f(ry) + '" x2="' + f(x + w) + '" y2="' + f(ry) + '" stroke="' + (mortar || 'rgba(59,42,34,.14)') + '" stroke-width="1.1"/>';
      var cxp = x + r() * 40;
      while (cxp < x + w) {
        g += '<line x1="' + f(cxp) + '" y1="' + f(ry) + '" x2="' + f(cxp) + '" y2="' + f(ry + h / rows) + '" stroke="' + (mortar || 'rgba(59,42,34,.14)') + '" stroke-width="1.1"/>';
        cxp += 24 + r() * 42;
      }
    }
    return g;
  }

  /* Little boat on the bay. */
  function boat(x, y, s, hull, sail) {
    return '<g class="ww-bob" style="transform-origin:' + f(x) + 'px ' + f(y) + 'px;animation-delay:' + f(-x % 5) + 's">' +
      (sail ? '<path d="M ' + f(x) + ' ' + f(y - 2 * s) + ' L ' + f(x) + ' ' + f(y - 30 * s) + ' L ' + f(x + 17 * s) + ' ' + f(y - 3 * s) + ' Z" fill="' + sail + '"/>' : '') +
      '<path d="M ' + f(x - 16 * s) + ' ' + f(y) + ' q ' + f(16 * s) + ' ' + f(9 * s) + ' ' + f(34 * s) + ' 0 Z" fill="' + (hull || P.espresso) + '"/></g>';
  }

  function grassTufts(x, y, w, n, seed, color) {
    var r = rand(seed || 23), g = '';
    for (var i = 0; i < n; i++) {
      var gx = x + r() * w, hgt = 8 + r() * 16;
      /* only some of the grass moves — nobody counts, and the layer repaints
         a third as often */
      var sway = i % 3 === 0;
      g += '<path' + (sway ? ' class="ww-sway"' : '') + ' style="transform-origin:' + f(gx) + 'px ' + f(y) + 'px;animation-delay:' + (-r() * 5).toFixed(1) + 's" d="M ' + f(gx) + ' ' + f(y) +
           ' q ' + f((r() - 0.5) * 10) + ' -' + f(hgt * 0.6) + ' ' + f((r() - 0.5) * 14) + ' -' + f(hgt) + '" fill="none" stroke="' + (color || P.oliveDeep) + '" stroke-width="1.7" stroke-linecap="round"/>';
    }
    return g;
  }

  /* Framing olive branch that hangs into the top of the frame. */
  function branch(x, y, s, flip, pal, seed) {
    pal = pal || {};
    var leaf = pal.leaf || P.oliveDeep, leaf2 = pal.leaf2 || P.olive;
    var r = rand(seed || 29), g = '';
    var dir = flip ? -1 : 1;
    var d = 'M ' + f(x) + ' ' + f(y) + ' q ' + f(dir * 130 * s) + ' ' + f(64 * s) + ' ' + f(dir * 300 * s) + ' ' + f(52 * s);
    g += '<path d="' + d + '" fill="none" stroke="#6B5744" stroke-width="' + f(7 * s) + '" stroke-linecap="round"/>';
    for (var i = 0; i < 26; i++) {
      var t = 0.08 + (i / 26) * 0.92;
      var lx = x + dir * (2 * (1 - t) * t * 130 + t * t * 300) * s;
      var ly = y + (2 * (1 - t) * t * 64 + t * t * 52) * s;
      var ang = (r() * 360) | 0;
      g += '<ellipse cx="' + f(lx) + '" cy="' + f(ly + (r() - 0.5) * 26 * s) + '" rx="' + f((16 + r() * 9) * s) + '" ry="' + f((5 + r() * 2.6) * s) +
           '" fill="' + (i % 3 ? leaf : leaf2) + '" transform="rotate(' + ang + ' ' + f(lx) + ' ' + f(ly) + ')" opacity=".93"/>';
    }
    return '<g class="ww-sway-slow" style="transform-origin:' + f(x) + 'px ' + f(y) + 'px">' + g + '</g>';
  }

  /* ======================================================================
     PEOPLE — flat, hand-made, deliberately a bit wonky, but properly built.
     Every limb is a round-capped polyline that STARTS at the shoulder or
     hip it belongs to, so an arm can never float free of its body. Poses
     are described in fractions of the figure's height, which keeps the
     proportions honest at any scale.
     ====================================================================== */

  var SKINS   = ['#EFC49F', '#E2AC81', '#C98A5E', '#A06A43', '#7A4E32', '#5B3826'];
  var CLOTHES = ['#C4643C', '#7A97A8', '#7C8B5E', '#E4A853', '#9B4A2A', '#5A4260',
                 '#4E6E80', '#D98A5E', '#F4E7D3', '#3B2A22'];
  var HAIRS   = ['#3B2A22', '#5C4436', '#241A16', '#6B5744', '#2A2430', '#8A6A46', '#B08A55'];

  /* round-capped, round-joined polyline — the only way limbs are drawn */
  function limbPath(pts, w, color, extra) {
    var d = 'M ' + f(pts[0][0]) + ' ' + f(pts[0][1]);
    for (var i = 1; i < pts.length; i++) d += ' L ' + f(pts[i][0]) + ' ' + f(pts[i][1]);
    return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + f(w) +
      '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
  }

  /* Pose tables. Every offset is a fraction of the figure's height, measured
     from the shoulder (arms) or the hip (legs). [elbow, hand] / [knee, foot].
     dir = +1 facing right. */
  var POSES = {
    stand:  { armNear: [[.045, .125], [.070, .255]], armFar: [[-.040, .125], [-.062, .250]],
              legNear: [[.022, .215], [.014, .455]], legFar: [[-.020, .215], [-.030, .455]] },
    chat:   { armNear: [[.080, .095], [.170, .020]], armFar: [[-.045, .120], [-.055, .245]],
              legNear: [[.030, .215], [.045, .455]], legFar: [[-.022, .215], [-.048, .455]] },
    listen: { armNear: [[.055, .130], [.115, .195]], armFar: [[-.050, .125], [-.070, .240]],
              legNear: [[.018, .215], [.010, .455]], legFar: [[-.024, .218], [-.044, .455]] },
    toast:  { armNear: [[.090, .050], [.135, -.090]], armFar: [[-.045, .125], [-.058, .248]],
              legNear: [[.024, .215], [.018, .455]], legFar: [[-.022, .215], [-.036, .455]] },
    laugh:  { armNear: [[.075, .105], [.055, .010]], armFar: [[-.075, .105], [-.140, .150]],
              legNear: [[.030, .215], [.052, .455]], legFar: [[-.028, .215], [-.056, .455]] },
    photo:  { armNear: [[.105, .080], [.055, -.045]], armFar: [[-.100, .085], [-.050, -.045]],
              legNear: [[.026, .215], [.030, .455]], legFar: [[-.026, .215], [-.034, .455]] },
    wave:   { armNear: [[.085, .040], [.115, -.115]], armFar: [[-.042, .128], [-.055, .250]],
              legNear: [[.020, .215], [.012, .455]], legFar: [[-.022, .215], [-.034, .455]] },
    walk:   { armNear: [[.060, .120], [.030, .245]], armFar: [[-.055, .120], [-.020, .245]],
              legNear: [[.075, .200], [.130, .440]], legFar: [[-.055, .215], [-.105, .450]] },
    sit:    { armNear: [[.055, .105], [.150, .145]], armFar: [[-.045, .110], [.085, .150]],
              legNear: [[.130, .030], [.155, .255]], legFar: [[.112, .052], [.138, .258]] },
    /* drawn up to a table: legs straight down, where the tabletop hides them */
    table:  { armNear: [[.062, .100], [.140, .150]], armFar: [[-.058, .100], [-.120, .152]],
              legNear: [[.022, .140], [.032, .300]], legFar: [[-.022, .140], [-.032, .300]] },
    dance:  { armNear: [[.110, -.010], [.170, -.150]], armFar: [[-.115, .060], [-.205, .015]],
              legNear: [[.075, .200], [.120, .450]], legFar: [[-.080, .195], [-.135, .450]] },
    dance2: { armNear: [[.125, .045], [.215, -.035]], armFar: [[-.095, -.020], [-.140, -.160]],
              legNear: [[.055, .205], [.145, .450]], legFar: [[-.070, .215], [-.090, .450]] }
  };

  /* Small things people hold. Drawn at the hand, so they never drift off. */
  function prop(kind, hx, hy, s, tint) {
    if (kind === 'glass') {
      return '<path d="M ' + f(hx - 3.6 * s) + ' ' + f(hy - 2 * s) +
        ' l ' + f(7.2 * s) + ' 0 l -' + f(1.1 * s) + ' ' + f(5.2 * s) + ' l -' + f(5 * s) + ' 0 Z" fill="#FBF4E8" opacity=".92"/>' +
        '<path d="M ' + f(hx - 2.9 * s) + ' ' + f(hy - 1.2 * s) + ' l ' + f(5.8 * s) + ' 0 l -' + f(.7 * s) + ' ' + f(3 * s) +
        ' l -' + f(4.4 * s) + ' 0 Z" fill="' + (tint || '#E8B25E') + '" opacity=".85"/>' +
        '<rect x="' + f(hx - .5 * s) + '" y="' + f(hy + 3 * s) + '" width="' + f(1.2 * s) + '" height="' + f(3.4 * s) + '" fill="#FBF4E8" opacity=".8"/>';
    }
    if (kind === 'camera') {
      return '<rect x="' + f(hx - 5.5 * s) + '" y="' + f(hy - 4 * s) + '" width="' + f(11 * s) + '" height="' + f(8 * s) +
        '" rx="' + f(1.6 * s) + '" fill="#3B2A22"/>' +
        '<circle cx="' + f(hx) + '" cy="' + f(hy) + '" r="' + f(2.6 * s) + '" fill="#7A97A8"/>' +
        '<circle class="ww-twinkle" cx="' + f(hx + 4 * s) + '" cy="' + f(hy - 3 * s) + '" r="' + f(1.2 * s) + '" fill="#FFF3D0"/>';
    }
    if (kind === 'phone') {
      return '<rect x="' + f(hx - 2.2 * s) + '" y="' + f(hy - 4.4 * s) + '" width="' + f(4.4 * s) + '" height="' + f(8.4 * s) +
        '" rx="' + f(1 * s) + '" fill="#3B2A22"/>' +
        '<rect x="' + f(hx - 1.5 * s) + '" y="' + f(hy - 3.6 * s) + '" width="' + f(3 * s) + '" height="' + f(6.6 * s) + '" fill="#9FC4CE"/>';
    }
    if (kind === 'plate') {
      return '<ellipse cx="' + f(hx) + '" cy="' + f(hy) + '" rx="' + f(6.5 * s) + '" ry="' + f(2.4 * s) + '" fill="#FFFAF0"/>';
    }
    return '';
  }

  /**
   * person({ x, baseY, h, pose, flip, skin, cloth, hair, dress, flat, hold,
   *          anim, delay, seed })
   * baseY is the ground (or the seat front, for `sit`). Returns one <g>.
   */
  function person(o) {
    o = o || {};
    var x = o.x || 0, b = o.baseY || 0, h = o.h || 100;
    var r = rand(o.seed != null ? o.seed : (Math.abs(x * 31 + b * 17 + h) | 0) + 3);
    var flat  = o.flat || null;
    var skin  = flat || o.skin  || SKINS[(r() * SKINS.length) | 0];
    var cloth = flat || o.cloth || CLOTHES[(r() * CLOTHES.length) | 0];
    var hair  = flat || o.hair  || HAIRS[(r() * HAIRS.length) | 0];
    var shoe  = flat || '#3B2A22';
    var dir   = o.flip ? -1 : 1;
    var pose  = POSES[o.pose] || POSES.stand;
    var dress = o.dress != null ? o.dress : (r() < 0.45);
    var seated = o.pose === 'sit' || o.pose === 'table';

    /* skeleton */
    var headR = h * 0.098,
        headY = b - h * (seated ? 0.440 : 0.895),
        shY   = b - h * (seated ? 0.300 : 0.745),
        hipY  = b - h * (seated ? 0.020 : 0.455),
        shW   = h * 0.104,
        hipW  = h * 0.080,
        limbW = h * 0.070;

    /* a little wonkiness, so no two are quite the same */
    var lean = (r() - 0.5) * 2.2;
    var shTilt = (r() - 0.5) * h * 0.012;

    function pts(list, ox, oy) {
      var out = [[ox, oy]];
      for (var i = 0; i < list.length; i++) {
        out.push([ox + list[i][0] * h * dir, oy + list[i][1] * h]);
      }
      return out;
    }

    var shL = [x - shW * dir, shY + shTilt],     // far shoulder
        shR = [x + shW * dir, shY - shTilt],     // near shoulder
        hpL = [x - hipW * dir, hipY],
        hpR = [x + hipW * dir, hipY];

    var armFar  = pts(pose.armFar,  shL[0], shL[1]);
    var armNear = pts(pose.armNear, shR[0], shR[1]);
    var legFar  = pts(pose.legFar,  hpL[0], hpL[1]);
    var legNear = pts(pose.legNear, hpR[0], hpR[1]);

    var g = '';

    function sleeve(arm) {                     /* the cloth that covers the joint */
      return limbPath([arm[0], [arm[0][0] + (arm[1][0] - arm[0][0]) * 0.62,
                                arm[0][1] + (arm[1][1] - arm[0][1]) * 0.62]],
        limbW * 1.06, flat || shade(cloth, -0.04));
    }

    /* --- far arm and far leg go behind the body ---------------------- */
    g += limbPath(legFar, limbW, flat || shade(cloth, -0.20));
    g += limbPath(armFar, limbW * 0.80, flat || shade(skin, -0.10));
    if (!flat) g += sleeve(armFar);

    /* --- near leg ---------------------------------------------------- */
    g += limbPath(legNear, limbW, flat || shade(cloth, -0.08));
    if (!flat) {
      g += '<ellipse cx="' + f(legFar[2][0]) + '" cy="' + f(legFar[2][1] + limbW * 0.16) + '" rx="' + f(limbW * 0.70) + '" ry="' + f(limbW * 0.36) + '" fill="' + shade(shoe, 0.12) + '"/>';
      g += '<ellipse cx="' + f(legNear[2][0]) + '" cy="' + f(legNear[2][1] + limbW * 0.16) + '" rx="' + f(limbW * 0.74) + '" ry="' + f(limbW * 0.38) + '" fill="' + shoe + '"/>';
    }

    /* --- neck, drawn first so the collar covers where it joins -------- */
    g += '<rect x="' + f(x - h * 0.020 + h * 0.006 * dir) + '" y="' + f(headY + headR * 0.42) +
      '" width="' + f(h * 0.040) + '" height="' + f(h * 0.105) + '" fill="' + (flat || shade(skin, -0.16)) + '"/>';

    /* --- torso: round shoulders, a little waist ---------------------- */
    var torso = 'M ' + f(x - shW) + ' ' + f(shY + h * 0.022) +
      ' C ' + f(x - shW) + ' ' + f(shY - h * 0.030) + ', ' + f(x - shW * 0.44) + ' ' + f(shY - h * 0.046) + ', ' + f(x) + ' ' + f(shY - h * 0.046) +
      ' C ' + f(x + shW * 0.44) + ' ' + f(shY - h * 0.046) + ', ' + f(x + shW) + ' ' + f(shY - h * 0.030) + ', ' + f(x + shW) + ' ' + f(shY + h * 0.022) +
      ' L ' + f(x + hipW) + ' ' + f(hipY) + ' Q ' + f(x) + ' ' + f(hipY + h * 0.024) + ' ' + f(x - hipW) + ' ' + f(hipY) + ' Z';
    g += '<path d="' + torso + '" fill="' + cloth + '"/>';
    if (!flat) {
      /* a wedge of shade down the shadowed edge, so the body reads as solid */
      g += '<path d="M ' + f(x + shW * 0.40 * dir) + ' ' + f(shY - h * 0.018) +
        ' L ' + f(x + shW * dir) + ' ' + f(shY + h * 0.022) +
        ' L ' + f(x + hipW * dir) + ' ' + f(hipY) +
        ' L ' + f(x + hipW * 0.40 * dir) + ' ' + f(hipY) + ' Z" fill="' + shade(cloth, -0.18) + '" opacity=".3"/>';
    }
    if (dress && !seated) {
